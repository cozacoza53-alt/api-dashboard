<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель керування користувачами (REST API)</title>
  </head>
  <body>
    <div id="app" style="max-width: 700px; margin: 20px auto; font-family: sans-serif;">
      <h1>Панель керування користувачами (REST API)</h1>

      <!-- Панель кнопок керування -->
      <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button id="btn-load">🔄 Оновити список (GET)</button>
        <button id="btn-error" style="color: darkred;">💥 Симулювати помилку 404</button>
      </div>

      <!-- Форма додавання (POST) -->
      <form id="user-form" style="margin-bottom: 20px; padding: 12px; background: #f1f5f9;">
        <input id="input-name" placeholder="Ім'я та прізвище" required />
        <input id="input-email" type="email" placeholder="Email" required />
        <button type="submit">➕ Додати на сервер (POST)</button>
      </form>

      <!-- Блок статусу (Loading / Error) -->
      <div id="status-box" style="margin: 10px 0; font-weight: bold;"></div>

      <!-- Контейнер для списку карток -->
      <ul id="user-list" style="list-style: none; padding: 0;"></ul>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
